$kind: http-request
url: "{{baseUrl}}/course-offerings"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "course_id": {{courseId}},
      "academic_term_id": {{termId}},
      "instructor_id": {{instructorId}},
      "section": "LAB-A",
      "schedule": "Tuesday 09:00-12:00",
      "room": "Lab 1",
      "capacity": 30
    }
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) pm.collectionVariables.set('offeringId', pm.response.json().data.id);
    language: text/javascript
order: 2000
