$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@example.com",
      "password": "password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: if (pm.response.code === 200) pm.collectionVariables.set('token', pm.response.json().data.token);
    language: text/javascript
order: 1000
